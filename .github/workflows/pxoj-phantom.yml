name: PXOJ Phantom host checks
on:
  push:
    branches: [pxoj-phantom]
    paths:
      - 'independent/companion/**'
      - '.github/workflows/pxoj-phantom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: independent/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/agent_test.cjs
      - run: node --check agent.js
      - run: python package.py /tmp/pxoj-phantom-0.1.0.zip
