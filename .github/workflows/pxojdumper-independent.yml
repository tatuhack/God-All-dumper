name: Independent host checks
on:
  push:
    branches: [pxojdumper-independent]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/webui_test.mjs
